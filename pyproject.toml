[project]
name = "caesar-course-check"
version = "0.2.1"
description = "Menu-bar app that alerts you when a Northwestern CAESAR class seat opens"
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pillow>=10.0; sys_platform == 'win32'",
    "platformdirs>=4.14.8",
    "playwright>=1.49.0",
    "pywebview>=6.2.1",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
    "plyer>=2.1.0",
    "pyobjus>=1.2.4 ; sys_platform == 'darwin'",
    "pyobjc-framework-usernotifications>=13.0 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "dmgbuild>=2.0.0",
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]
